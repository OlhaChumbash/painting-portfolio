services:

  backend:
    build:
      context: ./backend

    container_name: painting_backend

    command: sh /app/entrypoint.sh

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    environment:
      POSTGRES_DB: painting_db
      POSTGRES_USER: painting_user
      POSTGRES_PASSWORD: painting_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin123

    depends_on:
      - postgres


  postgres:
    image: postgres:16

    container_name: painting_postgres

    restart: always

    environment:
      POSTGRES_DB: painting_db
      POSTGRES_USER: painting_user
      POSTGRES_PASSWORD: painting_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: